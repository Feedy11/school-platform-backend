# Actif avec SPRING_PROFILES_ACTIVE=prod
# Ici, aucun secret n'a de valeur par défaut : l'application refuse de démarrer s'il en manque un.

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Hibernate vérifie le schéma sans le modifier
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Pas de comptes de démonstration par défaut
app.seed.enabled=${SEED_ENABLED:false}
app.seed.admin-password=${SEED_ADMIN_PASSWORD}
app.seed.student-password=${SEED_STUDENT_PASSWORD}

# Swagger masqué par défaut
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}