spring.application.name=school-backend
server.port=${PORT:8080}

# Base de données (variables d'environnement, valeurs par défaut pour le dev local)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/school_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:ZGV2T25seVNlY3JldEtleUNoYW5nZU1lSW5Qcm9kMDA=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS : origines autorisées, séparées par des virgules (sans "/" final)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}

# Ne jamais exposer de détails d'erreur techniques
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Données de démonstration (mettre SEED_ENABLED=false en production)
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin123!}
app.seed.student-password=${SEED_STUDENT_PASSWORD:Student123!}

# Swagger (mettre SWAGGER_ENABLED=false pour le masquer en production)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.tags-sorter=alpha