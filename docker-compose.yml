services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: school_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définis POSTGRES_PASSWORD dans le fichier .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # accès depuis ta machine (DBeaver, psql) sur le port 5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d school_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/school_db
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Définis JWT_SECRET dans le fichier .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SPRING_JPA_SHOW_SQL: "false"
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!}
      SEED_STUDENT_PASSWORD: ${SEED_STUDENT_PASSWORD:-Student123!}
    restart: unless-stopped

volumes:
  postgres_data: